<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autowala Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <div id="clock"></div>
    <div id="user">👤 User: Guest</div>
  </div>

  <div class="player">
    <img id="cover" src="assets/cover.png" alt="Album Art">
    <h2 id="songTitle">Now Playing: Cyclone</h2>
    <audio id="player"></audio>
    <div class="controls">
      <button onclick="prevSong()">⏮ Prev</button>
      <button onclick="playSong()">▶ Play</button>
      <button onclick="pauseSong()">⏸ Pause</button>
      <button onclick="nextSong()">⏭ Next</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
