<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ऑटोवाला रेडिओ · Autowala Radio</title>
<meta name="description" content="Non-stop desi hits for every autowala. Live radio player streaming straight from the Songs folder.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛺</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="road-glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="chip chip--clock" id="clockChip">
    <span class="chip__eyebrow">IST</span>
    <span class="chip__value mono" id="clockValue">--:--:--</span>
  </div>

  <div class="chip chip--live" id="liveChip">
    <span class="chip__eyebrow">मीटर ऑन</span>
    <span class="chip__value">
      <i class="dot" aria-hidden="true"></i>
      <span class="mono" id="listenerCount">0</span> ड्रायव्हर्स
    </span>
  </div>
</header>

<main class="stage">

  <div class="badge" role="img" aria-label="Autowala Radio meter badge">
    <svg viewBox="0 0 220 220" class="badge__dial" aria-hidden="true">
      <defs>
        <radialGradient id="dialGold" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#fbe7ad"/>
          <stop offset="45%" stop-color="#e8b04b"/>
          <stop offset="100%" stop-color="#a86f22"/>
        </radialGradient>
      </defs>
      <circle cx="110" cy="110" r="104" fill="url(#dialGold)"/>
      <circle cx="110" cy="110" r="104" fill="none" stroke="#5c3b16" stroke-width="2" opacity="0.35"/>
      <g class="dial__ticks" stroke="#5c3b16" stroke-width="2.4" opacity="0.55">
        <!-- 24 tick marks like a fare meter dial -->
      </g>
      <circle cx="110" cy="110" r="78" fill="none" stroke="#5c3b16" stroke-width="1.5" opacity="0.3"/>
    </svg>

    <svg viewBox="0 0 100 100" class="badge__icon" aria-hidden="true">
      <!-- simple auto-rickshaw silhouette -->
      <g fill="#2a1c0f">
        <path d="M22 62 C22 50 30 40 42 40 L60 40 C70 40 77 46 80 55 L86 62 L86 70 L18 70 Z"/>
        <path d="M60 40 L64 24 L70 24 L72 40 Z"/>
        <path d="M14 62 L22 62 L22 70 L14 70 Z"/>
        <circle cx="30" cy="74" r="8"/>
        <circle cx="72" cy="74" r="8"/>
        <circle cx="30" cy="74" r="3" fill="#e8b04b"/>
        <circle cx="72" cy="74" r="3" fill="#e8b04b"/>
      </g>
    </svg>
  </div>

  <h1 class="title">
    <span class="title__mr">ऑटोवाला रेडिओ</span>
    <span class="title__dot">·</span>
    <span class="title__en">Autowala Radio</span>
  </h1>
  <p class="subtitle">NON&#8209;STOP SEAT&#8209;BELT&#8209;OFF HITS</p>

  <section class="player" aria-label="Music player">
    <div class="player__nowplaying">
      <span class="eyebrow" id="statusLabel">आत्ता वाजतंय · NOW PLAYING</span>
    </div>

    <div class="player__body">
      <div class="cover" id="cover" aria-hidden="true">
        <svg viewBox="0 0 60 60" class="cover__note">
          <path d="M40 8 L40 34 A7 7 0 1 1 37 28 L37 13 L22 16 L22 40 A7 7 0 1 1 19 34 L19 11 Z" fill="currentColor"/>
        </svg>
      </div>

      <div class="meta">
        <h2 class="song-title" id="songTitle">स्टेशन ट्यून होत आहे…</h2>
        <p class="song-artist" id="songArtist">कृपया थांबा</p>
      </div>
    </div>

    <div class="progress">
      <input type="range" id="seek" class="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <div class="progress__fill" id="progressFill"></div>
    </div>

    <div class="times">
      <span class="mono" id="timeCurrent">0:00</span>
      <span class="mono" id="timeTotal">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl ctrl--side" id="prevBtn" aria-label="Previous song">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5L9 12l10 7z"/></svg>
      </button>
      <button class="ctrl ctrl--main" id="playBtn" aria-label="Play">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl ctrl--side" id="nextBtn" aria-label="Next song">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7-10 7z"/></svg>
      </button>
    </div>

    <div class="subcontrols">
      <button class="mini-toggle" id="shuffleBtn" aria-pressed="false" title="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-3.6a3 3 0 0 0-2.5 1.3L6.9 16H3v-2h2.9l4-6.7A5 5 0 0 1 14 5h3V3zM17 21l4-4-4-4v3h-3a5 5 0 0 1-4.1-2.2L6.9 8H3V6h2.9l3.9 6.8A3 3 0 0 0 12.4 14H17v3z"/></svg>
        <span>शफल</span>
      </button>
      <button class="mini-toggle" id="repeatBtn" aria-pressed="true" title="Repeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
        <span>रिपीट</span>
      </button>
      <button class="mini-toggle" id="playlistBtn" aria-pressed="false" title="Playlist">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
        <span>यादी</span>
      </button>
    </div>
  </section>

  <section class="playlist" id="playlistPanel" hidden>
    <div class="playlist__head">
      <h3>गाड्यांची यादी · Playlist</h3>
      <span class="mono" id="songCount">0 गाणी</span>
    </div>
    <ul class="playlist__list" id="playlistList"></ul>
  </section>

  <p class="status-line" id="statusLine" role="status" aria-live="polite"></p>

</main>

<footer class="skyline" aria-hidden="true">
  <svg viewBox="0 0 1600 200" preserveAspectRatio="none" class="skyline__svg">
    <rect x="0" y="150" width="1600" height="50" fill="#120b06"/>
    <g fill="#1c1209" opacity="0.9">
      <!-- repeated rickshaw silhouettes along the road -->
      <g transform="translate(60,120) scale(1.1)">
        <path d="M0 40 C0 28 8 18 20 18 L40 18 C50 18 57 24 60 33 L66 40 L66 48 L-2 48 Z"/>
        <path d="M40 18 L44 2 L50 2 L52 18 Z"/>
        <circle cx="12" cy="52" r="7"/><circle cx="52" cy="52" r="7"/>
      </g>
      <g transform="translate(260,128) scale(0.9)">
        <path d="M0 40 C0 28 8 18 20 18 L40 18 C50 18 57 24 60 33 L66 40 L66 48 L-2 48 Z"/>
        <path d="M40 18 L44 2 L50 2 L52 18 Z"/>
        <circle cx="12" cy="52" r="7"/><circle cx="52" cy="52" r="7"/>
      </g>
      <g transform="translate(520,118) scale(1.25)">
        <path d="M0 40 C0 28 8 18 20 18 L40 18 C50 18 57 24 60 33 L66 40 L66 48 L-2 48 Z"/>
        <path d="M40 18 L44 2 L50 2 L52 18 Z"/>
        <circle cx="12" cy="52" r="7"/><circle cx="52" cy="52" r="7"/>
      </g>
      <g transform="translate(860,126) scale(1)">
        <path d="M0 40 C0 28 8 18 20 18 L40 18 C50 18 57 24 60 33 L66 40 L66 48 L-2 48 Z"/>
        <path d="M40 18 L44 2 L50 2 L52 18 Z"/>
        <circle cx="12" cy="52" r="7"/><circle cx="52" cy="52" r="7"/>
      </g>
      <g transform="translate(1120,120) scale(1.15)">
        <path d="M0 40 C0 28 8 18 20 18 L40 18 C50 18 57 24 60 33 L66 40 L66 48 L-2 48 Z"/>
        <path d="M40 18 L44 2 L50 2 L52 18 Z"/>
        <circle cx="12" cy="52" r="7"/><circle cx="52" cy="52" r="7"/>
      </g>
      <g transform="translate(1400,128) scale(0.95)">
        <path d="M0 40 C0 28 8 18 20 18 L40 18 C50 18 57 24 60 33 L66 40 L66 48 L-2 48 Z"/>
        <path d="M40 18 L44 2 L50 2 L52 18 Z"/>
        <circle cx="12" cy="52" r="7"/><circle cx="52" cy="52" r="7"/>
      </g>
    </g>
    <rect x="0" y="176" width="1600" height="4" fill="#e8b04b" opacity="0.5"/>
  </svg>
</footer>

<audio id="audio" preload="metadata"></audio>

<script src="script.js" defer></script>
</body>
</html>
